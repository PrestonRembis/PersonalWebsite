<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Preston Rembis</title>
    <link rel="stylesheet" href="/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/reveal.js"></script>
</head>

<body class="bg-stone-900 text-white flex flex-col min-h-screen">
    <!-- include:header -->

    <main class="flex-1">
        <h2 class="text-center text-2xl font-bold text-orange-500 mt-6 mb-4" data-reveal>Reach Out!</h2>
        <p class="mb-6 text-lg text-gray-300 text-center [--reveal-delay:150ms]" data-reveal>
            Feel free to reach out to me via the form below and I will get back to you as soon as possible.
        </p>

        <div class="flex justify-center [--reveal-delay:300ms]" data-reveal>
            <form id="contact-form" class="bg-stone-800 p-6 rounded-lg w-full max-w-md">
                <div class="mb-4">
                    <label for="name" class="block text-gray-300 mb-2">Name</label>
                    <input type="text" id="name" name="name" class="w-full px-3 py-2 rounded bg-stone-700 text-white focus:outline-none focus:ring-2 focus:ring-orange-500">
                </div>
                <div class="mb-4">
                    <label for="email" class="block text-gray-300 mb-2">Email</label>
                    <input type="email" id="email" name="email" class="w-full px-3 py-2 rounded bg-stone-700 text-white focus:outline-none focus:ring-2 focus:ring-orange-500">
                </div>
                <div class="mb-4">
                    <label for="message" class="block text-gray-300 mb-2">Message</label>
                    <textarea id="message" name="message" rows="4" class="w-full px-3 py-2 rounded bg-stone-700 text-white focus:outline-none focus:ring-2 focus:ring-orange-500"></textarea>
                </div>
                <div class="mb-4 flex justify-center">
                    <div class="h-captcha" data-captcha="true" data-theme="dark"></div>
                </div>
                <div class="flex justify-center">
                    <button type="submit" class="bg-orange-500 hover:bg-orange-400 hover:transform hover:scale-105 text-white font-bold py-2 px-4 rounded transition-all duration-300 ease-in-out cursor-pointer">
                        Send Message
                    </button>
                </div>
                <p id="formStatus" class="text-center mt-4"></p>
            </form>
        </div>
    </main>

    <!-- include:footer -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/nav.js"></script>
    <script src="https://web3forms.com/client/script.js" async defer></script>
    <script>
        document.getElementById('contact-form').addEventListener('submit', function (e) {
            e.preventDefault();
            sendMessage();
        });

        async function sendMessage() {
            const statusEl = document.getElementById('formStatus');

            // The hCaptcha widget writes its token into this hidden field once solved
            const captchaField = document.querySelector('[name="h-captcha-response"]');
            const captchaToken = captchaField ? captchaField.value : '';
            if (!captchaToken) {
                statusEl.textContent = 'Please complete the captcha.';
                statusEl.className = 'text-center mt-4 text-red-400';
                return;
            }

            const formData = new FormData();
            // Filled in at build time from the WEB3FORMS_ACCESS_KEY environment variable
            formData.append('access_key', '{{WEB3FORMS_ACCESS_KEY}}');
            formData.append('name', document.getElementById('name').value);
            formData.append('email', document.getElementById('email').value);
            formData.append('message', document.getElementById('message').value);
            formData.append('h-captcha-response', captchaToken);

            statusEl.textContent = 'Sending...';
            statusEl.className = 'text-center mt-4 text-gray-300';

            try {
                const response = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (result.success) {
                    statusEl.textContent = 'Message sent! I\'ll get back to you soon.';
                    statusEl.className = 'text-center mt-4 text-green-400';
                    document.getElementById('name').value = '';
                    document.getElementById('email').value = '';
                    document.getElementById('message').value = '';
                } else {
                    statusEl.textContent = 'Something went wrong. Please try again.';
                    statusEl.className = 'text-center mt-4 text-red-400';
                }
            } catch (error) {
                statusEl.textContent = 'Something went wrong. Please try again.';
                statusEl.className = 'text-center mt-4 text-red-400';
            }

            // Captcha tokens are single-use, so require a fresh solve for the next message
            if (window.hcaptcha) {
                hcaptcha.reset();
            }
        }
    </script>
</body>

</html>
